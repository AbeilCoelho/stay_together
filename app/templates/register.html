{% extends "base.html" %}

{% block content %}
<div class="w-full max-w-md bg-white p-8 rounded-3xl shadow-xl border border-brand-100">
    <div class="text-center mb-8">
        <h1 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-brand-500 to-purple-500 mb-2">Create Account</h1>
        <p class="text-gray-500">Start your private space together.</p>
    </div>

    <form method="POST" class="space-y-6">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        
        <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Username</label>
            <input type="text" name="username" required 
                class="w-full px-4 py-3 rounded-xl bg-gray-50 border border-gray-200 focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition-all outline-none">
        </div>
        
        <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Password</label>
            <input type="password" name="password" required 
                class="w-full px-4 py-3 rounded-xl bg-gray-50 border border-gray-200 focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition-all outline-none">
        </div>

        <button type="submit" 
            class="w-full py-3 px-4 bg-gradient-to-r from-brand-500 to-brand-600 text-white font-bold rounded-xl shadow-md hover:shadow-lg transform hover:-translate-y-0.5 transition-all">
            Register
        </button>
    </form>

    <p class="mt-6 text-center text-gray-600">
        Already have an account? 
        <a href="/login" class="text-brand-600 font-semibold hover:underline">Log In</a>
    </p>
</div>
{% endblock %}
